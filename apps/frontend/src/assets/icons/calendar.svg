<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none" aria-hidden="true">
  <!-- 背景の長方形 -->
  <rect x="10" y="20" width="80" height="70" rx="10" fill="#E0E0E0" stroke="#B0B0B0" stroke-width="2"/>
  <!-- カレンダーの上部（タイトル部分） -->
  <rect x="10" y="20" width="80" height="15" rx="5" fill="#B0BEC5"/>
  <!-- 日付の小さな四角形 -->
  <rect x="20" y="40" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="35" y="40" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="50" y="40" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="65" y="40" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>

  <rect x="20" y="55" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="35" y="55" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="50" y="55" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="65" y="55" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>

  <rect x="20" y="70" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="35" y="70" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="50" y="70" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
  <rect x="65" y="70" width="10" height="10" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
  <!-- カレンダーの日付番号や詳細は省略 -->
</svg>
