name: CI
on: [push, pull_request]
jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # vite 開発サーバは起動せず、使い捨てコンテナで lint / type-check を実行する
      # （up -d で dev サーバを走らせたまま並走させると OOM で kill される）
      - name: Lint & Type Check
        run: >
          docker compose run --rm --no-deps -T frontend
          sh -c "npm install && npm run lint && npm run type-check"
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Prepare Env
        run: cp apps/api/example.env apps/api/.env
      - name: Start API
        run: docker compose up -d api db
      - name: Check Format
        run: docker compose exec -T api cargo fmt -- --check
      - name: Check Clippy
        run: docker compose exec -T api cargo clippy -- -D warnings
      - name: Prepare DB
        run: docker compose exec -T db sh -c "cd bin && bash ./prepare.sh"
      - name: Test API
        run: docker compose exec -T api cargo test -- --test-threads=1
  test-generator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup Generator
        run: npm ci
      - name: Lint/Format Generator
        run: npm run lint
  test-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: ShellCheck
        run: find cli db -name "*.sh" | xargs shellcheck
